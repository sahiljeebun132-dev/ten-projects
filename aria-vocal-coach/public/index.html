<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="description" content="Aria — your live singing coach. Learn to sing in tune from beginner to master with real-time pitch coaching." />
    <title>Aria Vocal Coach</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="Aria home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="9" fill="url(#g)"/><path d="M7 19c2.5 0 2.5-6 5-6s2.5 8 5 8 2.5-11 5-11 2 5 3 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">Aria</span>
      </a>
      <div class="topbar-right">
        <span id="input-pill" class="pill" title="Voice input"></span>
        <button id="settings-btn" class="icon-btn" aria-label="Settings">⚙️</button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <a class="tab" href="#/home" data-tab="home"><span class="ico">🏠</span><span>Home</span></a>
      <a class="tab" href="#/learn" data-tab="learn"><span class="ico">🎓</span><span>Learn</span></a>
      <a class="tab" href="#/riyaaz" data-tab="riyaaz"><span class="ico">🪔</span><span>Riyaaz</span></a>
      <a class="tab" href="#/teacher" data-tab="teacher"><span class="ico">🧑‍🏫</span><span>Teacher</span></a>
      <a class="tab" href="#/songs" data-tab="songs"><span class="ico">🎵</span><span>Songs</span></a>
    </nav>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </body>
</html>
